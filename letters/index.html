<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reference letters – Lazaros Souvaitzis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%89%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEFF3; --surface: #FFFFFF; --surface-2: #F4F5F9;
    --ink: #1C2333; --ink-soft: #5B6178; --ink-faint: #8C90A0;
    --accent: #3A5BA0; --accent-soft: #E1E7F5; --line: #DADDE5; --good: #2E7D5B; --bad: #B23A34; --bad-soft: rgba(178,58,52,.13);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161D; --surface: #1B1E28; --surface-2: #21242F;
      --ink: #E7E8EC; --ink-soft: #9195A6; --ink-faint: #6C7080;
      --accent: #86A5E4; --accent-soft: #232B42; --line: #2B2E3B; --good: #59B98B; --bad: #E1746D; --bad-soft: rgba(225,116,109,.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161D; --surface: #1B1E28; --surface-2: #21242F;
    --ink: #E7E8EC; --ink-soft: #9195A6; --ink-faint: #6C7080;
    --accent: #86A5E4; --accent-soft: #232B42; --line: #2B2E3B; --good: #59B98B; --bad: #E1746D; --bad-soft: rgba(225,116,109,.16);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-weight: 500; font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 8px;
  }
  .intro { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 8px; max-width: 60ch; }
  .note { color: var(--ink-faint); font-size: 0.82rem; margin: 0 0 32px; max-width: 60ch; }
  article { padding: 22px 0; border-top: 1px solid var(--line); }
  article:last-of-type { border-bottom: 1px solid var(--line); }
  .due {
    display: inline-block; font-size: 0.78rem; font-weight: 600; letter-spacing: .02em;
    color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 3px 8px; margin-bottom: 8px;
  }
  h2 {
    font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 1.2rem;
    line-height: 1.3; margin: 0 0 4px;
  }
  .due.soon { color: var(--bad); background: var(--bad-soft); }
  .inst { margin: 0 0 4px; color: var(--ink-soft); font-size: 0.9rem; }
  .ad { margin: 0 0 12px; font-size: 0.85rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dl {
    margin: 0; padding: 12px 14px; background: var(--surface-2); border-radius: 8px;
    display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 0.88rem;
  }
  dt { color: var(--ink-soft); }
  dd { margin: 0; }
  .unknown {
    margin: 0; padding: 12px 14px; background: var(--surface-2); border-radius: 8px;
    color: var(--ink-faint); font-size: 0.88rem;
  }
  .status { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; }
  .tick { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--ink-soft); }
  .tick.on { color: var(--good); font-weight: 500; }
  .tick input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .tick input:disabled { cursor: default; }
  @media (max-width: 520px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div id="app"><main><h1>Reference letters</h1><p class="note">Loading…</p></main></div>
<script>
(function () {
  'use strict';

  var app = document.getElementById('app');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function link(url, text) {
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + text + '</a>';
  }

  function daysUntil(iso) {
    if (!iso) return null;
    var now = new Date();
    var todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var p = iso.split('-');
    return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - todayUTC) / 86400000);
  }

  function renderEntry(e) {
    var L = e.letter || {};
    var rows = '';
    if (L.recipient) rows += '<dt>Recipient</dt><dd>' + esc(L.recipient) + '</dd>';
    if (L.institute) rows += '<dt>Institute</dt><dd>' + esc(L.institute) + '</dd>';
    if (L.address) rows += '<dt>Address</dt><dd>' + esc(L.address) + '</dd>';
    if (L.to) rows += '<dt>Send to</dt><dd>' + esc(L.to) + '</dd>';
    if (L.by) rows += '<dt>When</dt><dd>' + esc(L.by) + '</dd>';
    if (L.interfolio) rows += '<dt>Interfolio</dt><dd>' + link(L.interfolio, 'Open on Interfolio') + '</dd>';
    if (L.ajo) rows += '<dt>Academic Jobs Online</dt><dd>' + link(L.ajo, 'Open on AJO') + '</dd>';
    if (L.url) rows += '<dt>Instructions</dt><dd>' + link(L.url, 'Open page') + '</dd>';
    if (L.note) rows += '<dt>Notes</dt><dd>' + esc(L.note) + '</dd>';
    var letter = rows
      ? '<dl>' + rows + '</dl>'
      : '<p class="unknown">Letter instructions not stated in the ad. Details will be added here when confirmed.</p>';

    var dl = daysUntil(e.dueISO);
    var soon = !e.lettersSubmitted && dl !== null && dl >= 0 && dl <= 7;
    var leftText = dl === 0 ? 'due today' : dl === 1 ? '1 day left' : dl + ' days left';

    function tick(field, label) {
      var on = !!e[field];
      return '<label class="tick' + (on ? ' on' : '') + '"><input type="checkbox"' + (on ? ' checked' : '') + ' disabled> ' + label + '</label>';
    }

    return '<article>' +
      '<div class="due' + (soon ? ' soon' : '') + '">' + esc(e.dueText) + (soon ? ' \u00b7 ' + leftText : '') + '</div>' +
      '<h2>' + esc(e.position) + '</h2>' +
      '<p class="inst">' + esc(e.institution) + '</p>' +
      '<p class="ad">' + (e.callLink ? link(e.callLink, 'Job ad') : '') + '</p>' +
      letter +
      '<div class="status">' + tick('appSubmitted', 'Application submitted') + tick('lettersSubmitted', 'Letters submitted') + '</div>' +
    '</article>';
  }

  function page(inner) {
    return '<main>' +
      '<h1>Reference letters</h1>' +
      '<p class="intro">Letters of recommendation for Lazaros Souvaitzis, listed by deadline. Where an ad doesn\u2019t say how or where letters go, it\u2019s marked as not stated and will be updated once confirmed.</p>' +
      inner +
    '</main>';
  }

  function show(data) {
    var list = (data && data.entries ? data.entries : []).filter(function (e) { return !e.hidden; });
    list.sort(function (a, b) {
      var x = a.dueISO || '9999', y = b.dueISO || '9999';
      return x < y ? -1 : x > y ? 1 : 0;
    });
    app.innerHTML = page(
      '<p class="note">The tick boxes show progress and are updated by the applicant as things are submitted.</p>' +
      list.map(renderEntry).join('')
    );
  }

  function fail(err) {
    app.innerHTML = page('<p class="unknown">Sorry, the list could not be loaded right now. Please try again in a few minutes. (' + esc(err && err.message ? err.message : err) + ')</p>');
  }

  fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('data.json: HTTP ' + r.status);
      return r.json();
    })
    .then(show)
    .catch(fail);
})();
</script>
</body>
</html>
