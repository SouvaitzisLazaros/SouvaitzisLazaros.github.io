  }

  .ad { margin: 0 0 12px; font-size: 0.85rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dl {
    margin: 0; padding: 12px 14px; background: var(--surface-2); border-radius: 8px;
    display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 0.88rem;
  }
  dt { color: var(--ink-soft); }
  dd { margin: 0; }
  .unknown {
    margin: 0; padding: 12px 14px; background: var(--surface-2); border-radius: 8px;
    color: var(--ink-faint); font-size: 0.88rem;
  }
  .status { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; }
  .tick { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--ink-soft); }
  .tick.on { color: var(--good); font-weight: 500; }
  .tick input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .tick input:disabled { cursor: default; }
  @media (max-width: 520px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 8px; }
  }
